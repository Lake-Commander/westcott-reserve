name: Build Westcott Reserve APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Westcott Reserve APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Prepare optional Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "Firebase Android configuration is not set; push token registration will require it."
          fi

      - name: Verify Production Signing Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }

      - name: Prepare Production Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/westcott-release.p12"
          chmod 600 "$RUNNER_TEMP/westcott-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/westcott-release.p12" >> "$GITHUB_ENV"

      - name: Build Westcott Reserve APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY || vars.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing EXPO_PUBLIC_SUPABASE_URL repository secret or variable"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_KEY" || test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing EXPO_PUBLIC_SUPABASE_KEY repository secret or variable (or legacy EXPO_PUBLIC_SUPABASE_ANON_KEY secret)"; exit 1; }
          test -s "$ANDROID_KEYSTORE_PATH" || { echo "Production keystore was not prepared"; exit 1; }
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify Standalone APK
        run: |
          apk_path=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk_path"
          unzip -l "$apk_path" | grep -q 'assets/index.android.bundle'
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)
          test -n "$apksigner_path" || { echo "Android apksigner tool was not found"; exit 1; }
          "$apksigner_path" verify "$apk_path"
          cp "$apk_path" "android/app/build/outputs/apk/release/Westcott Reserve.apk"

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Configure Vercel Project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN repository secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          vercel pull --yes --environment=production --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"

      - name: Sync production server secrets to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY || vars.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL || vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME || vars.BREVO_SENDER_NAME }}
          BREVO_REPLY_TO_EMAIL: ${{ secrets.BREVO_REPLY_TO_EMAIL || vars.BREVO_REPLY_TO_EMAIL }}
        run: |
          public_key="${EXPO_PUBLIC_SUPABASE_KEY:-$EXPO_PUBLIC_SUPABASE_ANON_KEY}"
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing EXPO_PUBLIC_SUPABASE_URL repository secret or variable"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }
          test -n "$public_key" || { echo "Missing EXPO_PUBLIC_SUPABASE_KEY repository secret or variable (or legacy EXPO_PUBLIC_SUPABASE_ANON_KEY secret)"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY repository secret"; exit 1; }
          test -n "$BREVO_API_KEY" || { echo "Missing BREVO_API_KEY repository secret"; exit 1; }
          test -n "$BREVO_SENDER_EMAIL" || { echo "Missing BREVO_SENDER_EMAIL repository secret"; exit 1; }
          test -n "$BREVO_SENDER_NAME" || { echo "Missing BREVO_SENDER_NAME repository secret"; exit 1; }

          add_production_secret() {
            printf '%s' "$2" | vercel env add "$1" --environment=production --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --sensitive --force --yes --token="$VERCEL_TOKEN"
          }

          add_production_config() {
            printf '%s' "$2" | vercel env add "$1" --environment=production --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --no-sensitive --force --yes --token="$VERCEL_TOKEN"
          }

          add_production_config EXPO_PUBLIC_SUPABASE_URL "$EXPO_PUBLIC_SUPABASE_URL"
          add_production_config EXPO_PUBLIC_SUPABASE_KEY "$public_key"
          add_production_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          add_production_secret BREVO_API_KEY "$BREVO_API_KEY"
          add_production_config BREVO_SENDER_EMAIL "$BREVO_SENDER_EMAIL"
          add_production_config BREVO_SENDER_NAME "$BREVO_SENDER_NAME"
          if [ -n "$BREVO_REPLY_TO_EMAIL" ]; then
            add_production_config BREVO_REPLY_TO_EMAIL "$BREVO_REPLY_TO_EMAIL"
          fi

          vercel pull --yes --environment=production --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"

      - name: Build Website (Without APK)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          vercel build --prod --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"

      - name: Inject APK into Vercel Build Output
        run: |
          mkdir -p .vercel/output/static/downloads
          cp "android/app/build/outputs/apk/release/Westcott Reserve.apk" .vercel/output/static/downloads/westcott-reserve.apk
          test -s .vercel/output/static/downloads/westcott-reserve.apk

      - name: Deploy Website with APK
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prebuilt --prod --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"

      - name: Upload APK Artifact to GitHub
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Westcott Reserve APK
          path: android/app/build/outputs/apk/release/Westcott Reserve.apk