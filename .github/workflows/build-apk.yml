name: Build Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Verify Production Signing Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }

      - name: Prepare Production Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/westcott-release.p12"
          chmod 600 "$RUNNER_TEMP/westcott-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/westcott-release.p12" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing EXPO_PUBLIC_SUPABASE_URL repository secret"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_KEY" || test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing EXPO_PUBLIC_SUPABASE_KEY repository secret (or legacy EXPO_PUBLIC_SUPABASE_ANON_KEY)"; exit 1; }
          test -s "$ANDROID_KEYSTORE_PATH" || { echo "Production keystore was not prepared"; exit 1; }
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify Standalone APK
        run: |
          apk_path=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk_path"
          unzip -l "$apk_path" | grep -q 'assets/index.android.bundle'
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)
          test -n "$apksigner_path" || { echo "Android apksigner tool was not found"; exit 1; }
          "$apksigner_path" verify "$apk_path"

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Stage APK for Website
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/release/app-release.apk public/downloads/westcott-reserve.apk

      - name: Configure Vercel Project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN repository secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build and Deploy Website with APK
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"
          test -s .vercel/output/static/downloads/westcott-reserve.apk
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WestcottReserve-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk